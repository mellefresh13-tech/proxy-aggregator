name: Build proxy catalog

on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/aggregate.py'
      - 'sources.json'
      - '.github/workflows/catalog.yml'

permissions:
  contents: write

concurrency:
  group: proxy-catalog
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build catalog
        env:
          MAX_CANDIDATES: '1500'
          CHECK_WORKERS: '40'
          SPEED_PER_COUNTRY: '2'
          SPEED_WORKERS: '20'
          SPEED_TIMEOUT: '6'
          SPEED_LIMIT_MB: '3'
        run: python scripts/aggregate.py

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-catalog
          path: |
            data/servers.json
            data/countries.json
            data/stats.json
          retention-days: 14

      - name: Commit catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/servers.json data/countries.json data/stats.json
          if git diff --cached --quiet; then
            echo 'Catalog unchanged'
            exit 0
          fi
          git commit -m "Update proxy catalog"
          git push
