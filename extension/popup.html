<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DomikVPN</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">D</span>
        <div>
          <strong>DomikVPN</strong>
          <span class="subtitle">Browser VPN</span>
        </div>
      </div>
      <span id="state-dot" class="state-dot" title="Disconnected"></span>
    </header>

    <section class="connection-card">
      <div class="connection-state">
        <div>
          <span id="state-label">Disconnected</span>
          <span id="selected-location" class="selected-location">Choose a country</span>
        </div>
        <span id="catalog-source" class="muted"></span>
      </div>

      <button id="toggle" class="primary" disabled>Connect</button>
      <button id="next" class="secondary" hidden>Next server</button>
    </section>

    <section id="status" class="status">Loading catalog…</section>

    <section>
      <div class="section-title">
        <strong>Locations</strong>
        <span id="country-count" class="muted">—</span>
      </div>
      <div id="countries" class="countries"></div>
    </section>

    <section id="details" class="details" hidden>
      <div class="details-title">
        <span>Current server</span>
        <span id="d-score" class="score">—</span>
      </div>

      <div class="location-line">
        <span id="d-country">—</span>
        <span id="d-protocol">—</span>
      </div>

      <div class="metrics">
        <div><span>IP</span><strong id="d-ip">—</strong></div>
        <div><span>Ping</span><strong id="d-ping">—</strong></div>
        <div><span>Speed</span><strong id="d-speed">—</strong></div>
      </div>
    </section>

    <footer>
      <span>Catalog</span>
      <strong id="catalog-age">—</strong>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
